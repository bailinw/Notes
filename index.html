<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="笔记" />
<title>笔记</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #000;
    --card: #1c1c1e;
    --card-press: #2c2c2e;
    --card-hover: #232326;
    --label: #fff;
    --label-2: rgba(235, 235, 245, .6);
    --label-3: rgba(235, 235, 245, .32);
    --sep: rgba(84, 84, 88, .5);
    --blue: #0a84ff;
    --red: #ff453a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { overflow-x: hidden; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  button {
    font-family: inherit;
    border: 0;
    background: none;
    color: inherit;
    padding: 0;
    cursor: pointer;
  }

  input, textarea, select {
    font-family: inherit;
    border: 0;
    background: none;
    color: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  input::placeholder, textarea::placeholder { color: var(--label-3); }

  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }

  /* ============ 双体系页面 ============ */
  .system-page { display: none; }
  .system-page.active { display: block; }

  /* ============ 底部导航 ============ */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex;
    height: calc(49px + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(28, 28, 30, .86);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--sep);
  }
  .tabbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
    color: var(--label-3);
    transition: color .15s;
  }
  .tabbar button.active { color: var(--blue); }
  .tabbar svg {
    width: 23px; height: 23px;
    fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============ 列表页 ============ */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px calc(120px + 49px + var(--safe-bottom));
    min-height: 100%;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: calc(22px + var(--safe-top)) 4px 16px;
  }

  .page-head h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.8px;
    line-height: 1.15;
  }

  .count {
    font-size: 13px;
    color: var(--label-3);
    flex: none;
  }

  /* 分段控件 */
  .segmented {
    display: flex;
    background: var(--card);
    border-radius: 9px;
    padding: 2px;
    margin: 0 4px 16px;
  }
  .segmented button {
    flex: 1;
    height: 32px;
    border-radius: 7px;
    font-size: 14px;
    color: var(--label-2);
  }
  .segmented button.active {
    background: #3a3a3c;
    color: var(--label);
    font-weight: 600;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 11px;
    background: var(--card);
    border-radius: 11px;
    margin-bottom: 18px;
    transition: background .15s ease;
  }

  .search:focus-within { background: var(--card-press); }

  .search svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: var(--label-3);
    transition: fill .15s ease;
  }

  .search:focus-within svg { fill: var(--label-2); }

  .search input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
  }

  .notes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .note {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .note:active { background: var(--card-press); transform: scale(.985); }

  @media (hover: hover) {
    .note:hover { background: var(--card-hover); }
  }

  .note-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  .note-title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-title.untitled { color: var(--label-2); }

  .note-time {
    flex: none;
    font-size: 12px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
  }

  .note-preview {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--label-2);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-thumb {
    float: right;
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 6px;
    margin-left: 10px;
  }

  .mention { color: var(--blue); }

  /* 空状态 */
  .empty {
    display: none;
    text-align: center;
    padding: 90px 20px;
  }

  .empty.show { display: block; }

  .empty p {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 500;
    color: var(--label-2);
  }

  .empty span { font-size: 14px; color: var(--label-3); }

  /* 悬浮新建按钮 */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + 49px + var(--safe-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0a84ff, #0066d6);
    color: #fff;
    box-shadow: 0 8px 24px rgba(10, 132, 255, .38);
    transition: transform .16s ease, box-shadow .16s ease;
    z-index: 5;
  }

  .fab:active {
    transform: scale(.9);
    box-shadow: 0 4px 12px rgba(10, 132, 255, .3);
  }

  /* ============ 编辑页 ============ */
  .editor {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .34s cubic-bezier(.32, .72, 0, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
  }

  .editor.open { transform: translateX(0); }

  .editor-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .editor-bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 0 8px;
  }

  .bar-btn {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 17px;
    color: var(--blue);
    padding: 8px 2px;
    transition: opacity .12s ease;
  }

  .bar-btn:active { opacity: .45; }
  .bar-btn.primary { font-weight: 600; }

  .bar-btn svg {
    width: 11px;
    height: 19px;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .editor-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(32px + var(--safe-bottom));
    overscroll-behavior: contain;
  }

  .field { margin-bottom: 18px; }

  .field-label {
    display: block;
    font-size: 13px;
    color: var(--label-3);
    margin-bottom: 6px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--label);
  }

  .field select {
    -webkit-appearance: menulist;
    appearance: menulist;
  }

  .field textarea {
    min-height: 80px;
    resize: none;
    overflow: hidden;
  }

  .row-2 {
    display: flex;
    gap: 10px;
  }
  .row-2 .field { flex: 1; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chip {
    display: inline-flex;
    padding: 4px 10px;
    background: var(--card-press);
    border-radius: 10px;
    font-size: 13px;
    color: var(--label-2);
  }

  .img-preview {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
  }

  .place {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 8px;
  }
  .place input {
    background: var(--card);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
  }
  .place .p-name { flex: 0 0 110px; }
  .place .p-desc { flex: 1; }
  .place .p-del {
    flex: none;
    width: 34px;
    color: var(--red);
    font-size: 20px;
    line-height: 1;
  }
  .add-place {
    display: block;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    background: var(--card);
    color: var(--blue);
    font-size: 15px;
    margin-top: 4px;
  }

  .meta {
    font-size: 13px;
    color: var(--label-3);
    padding: 14px 0;
    border-top: 1px solid var(--sep);
    font-variant-numeric: tabular-nums;
  }

  .delete-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border-radius: 14px;
    background: var(--card);
    color: var(--red);
    font-size: 17px;
    text-align: center;
    transition: background .15s ease;
  }

  .delete-btn:active { background: var(--card-press); }

  @media (hover: hover) {
    .delete-btn:hover { background: var(--card-hover); }
  }

  /* ============ 笔记编辑器（复用 field 风格） ============ */
  .title {
    display: block;
    width: 100%;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--label);
    margin-bottom: 12px;
  }
  .content {
    display: block;
    width: 100%;
    min-height: 240px;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--label);
    resize: none;
    overflow: hidden;
  }

  .editor-toolbar { margin-top: 8px; }
  #mentionBtn {
    padding: 8px 14px;
    background: var(--card);
    border-radius: 10px;
    color: var(--blue);
    font-size: 14px;
  }

  /* ============ @ 提及选择器 ============ */
  .sheet-mask {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end;
  }
  .sheet-mask[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-height: 70dvh;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(20px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-head span { font-size: 17px; font-weight: 600; }
  .sheet-head button { color: var(--blue); font-size: 16px; }
  .sheet-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-group { font-size: 12px; color: var(--label-3); padding: 10px 4px 6px; }
  .sheet-item {
    padding: 12px;
    border-radius: 10px;
    background: var(--bg);
    margin-bottom: 6px;
    font-size: 16px;
  }
  .sheet-item:active { background: var(--card-press); }

  /* 桌面端微调 */
  @media (min-width: 720px) {
    .page { padding-top: 8px; }
    .fab { right: calc(50% - 360px + 4px); }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ===================== 笔记体系 ===================== -->
  <div class="page system-page active" id="systemNotes">
    <header class="page-head">
      <h1>笔记</h1>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 3.5a6.5 6.5 0 1 0 4.06 11.58l3.68 3.68a1 1 0 0 0 1.42-1.42l-3.68-3.68A6.5 6.5 0 0 0 10 3.5Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
      </svg>
      <input id="notesSearch" type="search" placeholder="搜索" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="notes" id="notesList"></div>

    <div class="empty" id="notesEmpty">
      <p>还没有笔记</p>
      <span>点击右下角的 + 开始记录</span>
    </div>
  </div>

  <!-- ===================== 设定体系 ===================== -->
  <div class="page system-page" id="systemLibrary">
    <div class="segmented" id="tabs">
      <button data-tab="worldview" class="active">世界观</button>
      <button data-tab="character">角色</button>
      <button data-tab="map">地图</button>
    </div>

    <header class="page-head">
      <h1 id="pageTitle">设定</h1>
      <span class="count" id="count"></span>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 3.5a6.5 6.5 0 1 0 4.06 11.58l3.68 3.68a1 1 0 0 0 1.42-1.42l-3.68-3.68A6.5 6.5 0 0 0 10 3.5Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
      </svg>
      <input id="librarySearch" type="search" placeholder="搜索" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="notes" id="notes"></div>

    <div class="empty" id="empty">
      <p>还没有笔记</p>
      <span>点击右下角的 + 开始记录</span>
    </div>
  </div>

  <button class="fab" id="fab" aria-label="新建">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button data-system="notes" class="active">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      <span>笔记</span>
    </button>
    <button data-system="library">
      <svg viewBox="0 0 24 24"><path d="M4 6h7v14H4zM13 6h7v14h-7z"/></svg>
      <span>设定</span>
    </button>
  </nav>

  <!-- ===================== 编辑页 ===================== -->
  <section class="editor" id="editor" aria-hidden="true">
    <div class="editor-inner">
      <header class="editor-bar">
        <button class="bar-btn" id="backBtn">
          <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
          <span id="backLabel">设定</span>
        </button>
        <button class="bar-btn primary" id="doneBtn">完成</button>
      </header>

      <div class="editor-body" id="editorBody">
        <div id="formBody"></div>
        <div class="meta" id="meta"></div>
        <button class="delete-btn" id="deleteBtn">删除</button>
      </div>
    </div>
  </section>

</div>

<!-- ===================== @ 提及选择器 ===================== -->
<div class="sheet-mask" id="mentionSheet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span>插入设定引用</span>
      <button id="mentionClose">取消</button>
    </div>
    <div class="search" style="margin:0 0 12px;">
      <input id="mentionSearch" type="search" placeholder="搜索名称" autocomplete="off" style="font-size:16px;">
    </div>
    <div class="sheet-list" id="mentionList"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- Supabase 客户端 ---------------- */
  const SUPABASE_URL = 'https://YOUR-PROJECT-URL.supabase.co';
  const SUPABASE_KEY = 'YOUR-ANON-PUBLIC-KEY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------------- 数据层 DB ---------------- */
  const DB = (function () {
    const KEY = 'oc-db-cache';
    const cache = { worldviews: [], characters: [], maps: [], notes: [] };

    function persistCache() {
      try { localStorage.setItem(KEY, JSON.stringify(cache)); }
      catch (e) { console.warn('缓存失败', e); }
    }

    function mapWorldview(row) {
      return {
        id: row.id,
        name: row.name,
        summary: row.summary,
        settings: row.settings,
        tags: row.tags ? JSON.parse(row.tags) : [],
        createdAt: row.created_at,
        updatedAt: row.updated_at
      };
    }

    function mapCharacter(row) {
      return {
        id: row.id,
        name: row.name,
        worldviewId: row.worldview_id,
        age: row.age,
        gender: row.gender,
        appearance: row.appearance,
        personality: row.personality,
        background: row.background,
        tags: row.tags ? JSON.parse(row.tags) : [],
        createdAt: row.created_at,
        updatedAt: row.updated_at
      };
    }

    function mapMap(row) {
      return {
        id: row.id,
        name: row.name,
        worldviewId: row.worldview_id,
        imageUrl: row.image_url,
        places: row.places || [],
        createdAt: row.created_at,
        updatedAt: row.updated_at
      };
    }

    function mapNote(row) {
      return {
        id: row.id,
        title: row.title,
        body: row.body,
        mentions: Array.isArray(row.mentions) ? {} : (row.mentions || {}),
        createdAt: row.created_at,
        updatedAt: row.updated_at
      };
    }

    return {
      init: async function () {
        // 先读本地缓存，立即渲染（不等网络）
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed) {
              cache.worldviews = parsed.worldviews || [];
              cache.characters = parsed.characters || [];
              cache.maps = parsed.maps || [];
              cache.notes = parsed.notes || [];
            }
          }
        } catch (e) { /* ignore */ }

        // 再异步从 Supabase 拉最新
        try {
          const [w, c, m, n] = await Promise.all([
            sb.from('worldviews').select('*').is('deleted_at', null),
            sb.from('characters').select('*').is('deleted_at', null),
            sb.from('maps').select('*').is('deleted_at', null),
            sb.from('notes').select('*').is('deleted_at', null)
          ]);
          if (w.error) throw w.error;
          if (c.error) throw c.error;
          if (m.error) throw m.error;
          if (n.error) throw n.error;
          cache.worldviews = w.data.map(mapWorldview);
          cache.characters = c.data.map(mapCharacter);
          cache.maps = m.data.map(mapMap);
          cache.notes = n.data.map(mapNote);
          persistCache();
        } catch (e) {
          console.warn('拉取最新数据失败，继续使用缓存', e);
        }
      },

      /* ---------- 世界观 ---------- */
      async listWorldviews() {
        try {
          const { data: rows, error } = await sb
            .from('worldviews')
            .select('*')
            .is('deleted_at', null)
            .order('updated_at', { ascending: false });
          if (error) throw error;
          const mapped = rows.map(mapWorldview);
          cache.worldviews = mapped;
          persistCache();
          return mapped;
        } catch (e) { return cache.worldviews.slice(); }
      },

      async getWorldview(id) {
        try {
          const { data: row, error } = await sb
            .from('worldviews')
            .select('*')
            .eq('id', id)
            .single();
          if (error) throw error;
          return mapWorldview(row);
        } catch (e) {
          return cache.worldviews.find(function (o) { return o.id === id; }) || null;
        }
      },

      async saveWorldview(obj) {
        const payload = {
          name: obj.name,
          summary: obj.summary,
          settings: obj.settings,
          tags: JSON.stringify(obj.tags || [])
        };
        if (obj.id) {
          const { data: row, error } = await sb
            .from('worldviews')
            .update(payload)
            .eq('id', obj.id)
            .select()
            .single();
          if (error) throw error;
          return mapWorldview(row);
        } else {
          const { data: row, error } = await sb
            .from('worldviews')
            .insert(payload)
            .select()
            .single();
          if (error) throw error;
          return mapWorldview(row);
        }
      },

      async deleteWorldview(id) {
        const { error } = await sb

  /* ---------------- 工具函数 ---------------- */
  const pad = (n) => String(n).padStart(2, '0');

  function uid() {
    if (window.crypto && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return 'n' + Date.now().toString(36) + Math.random().toString(16).slice(2);
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();

    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return pad(d.getHours()) + ':' + pad(d.getMinutes());

    const y = new Date(now);
    y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '昨天';

    if (d.getFullYear() === now.getFullYear()) {
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function formatFullTime(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function truncate(s, n) {
    s = (s || '').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function esc(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  async function worldviewNameMap() {
    const map = {};
    const wvs = await DB.listWorldviews();
    wvs.forEach(function (w) { map[w.id] = w.name || '未命名'; });

  }

  /* ---------------- 笔记列表渲染 ---------------- */
  async function renderNotes() {
    const q = notesSearch.value.trim().toLowerCase();
    let list = await DB.listNotes();
    list = list.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });

    if (q) {
      list = list.filter(function (n) {
        return ((n.title || '') + ' ' + (n.body || '')).toLowerCase().indexOf(q) !== -1;
      });
    }

    if (!list.length) {
      notesListEl.innerHTML = '';
      notesEmptyEl.classList.add('show');
      notesEmptyEl.querySelector('p').textContent = q ? '没有找到笔记' : '还没有笔记';
      notesEmptyEl.querySelector('span').textContent = q ? '换个关键词试试' : '点击右下角的 + 开始记录';
      return;
    }

    notesEmptyEl.classList.remove('show');

    const frag = document.createDocumentFragment();
    list.forEach(function (note) {
      frag.appendChild(renderNoteCard(note));
    });
    notesListEl.innerHTML = '';
    notesListEl.appendChild(frag);
  }

  function renderNoteCard(note) {
    const card = document.createElement('article');
    card.className = 'note';
    card.dataset.id = note.id;

    const head = document.createElement('div');
    head.className = 'note-head';

    const title = document.createElement('div');
    title.className = 'note-title' + (note.title ? '' : ' untitled');
    title.textContent = note.title || '新建笔记';

    const time = document.createElement('div');
    time.className = 'note-time';
    time.textContent = formatTime(note.updatedAt);

    head.appendChild(title);
    head.appendChild(time);

    const preview = document.createElement('p');
    preview.className = 'note-preview';
    preview.innerHTML = renderBodyPreview(note.body, note.mentions);

    card.appendChild(head);
    card.appendChild(preview);
    return card;
  }

  function renderBodyPreview(body, mentions) {
    body = body || '';
    const parts = [];
    const re = /@([^\s@，。！？、,.!?]{1,20})/g;
    let lastIndex = 0;
    let m;
    while ((m = re.exec(body)) !== null) {
      const name = m[1];
      parts.push(esc(body.slice(lastIndex, m.index)));
      if (mentions && mentions[name]) {
        const ent = mentions[name];
        parts.push('<span class="mention" data-type="' + ent.type + '" data-id="' + ent.id + '">@' + esc(name) + '</span>');
      } else {
        parts.push(esc('@' + name));
      }
      lastIndex = re.lastIndex;
    }
    parts.push(esc(body.slice(lastIndex)));
    return parts.join('');
  }

  /* ---------------- 设定列表渲染 ---------------- */
  async function renderLibrary() {
    const q = librarySearch.value.trim().toLowerCase();
    let list = [];

    if (state.libraryTab === 'worldview') {
      list = await DB.listWorldviews();
    } else if (state.libraryTab === 'character') {
      list = await DB.listCharacters();
    } else if (state.libraryTab === 'map') {
      list = await DB.listMaps();
    }

    list = list.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });

    cardSubtitle._wvMap = await worldviewNameMap();

    countEl.textContent = list.length ? list.length + ' 条' : '';

    if (!list.length) {
      notesEl.innerHTML = '';
      emptyEl.classList.add('show');
      const msg = EMPTY_MSG[state.libraryTab];
      emptyEl.querySelector('p').textContent = q ? '没有找到' + TAB_LABEL[state.libraryTab] : msg[0];
      emptyEl.querySelector('span').textContent = q ? '换个关键词试试' : msg[1];
      return;
    }

    let filtered = list;
    if (q) {
      filtered = await filterBySearch(list, q);
    }

    if (!filtered.length) {
      notesEl.innerHTML = '';
      emptyEl.classList.add('show');
      emptyEl.querySelector('p').textContent = '没有找到' + TAB_LABEL[state.libraryTab];
      emptyEl.querySelector('span').textContent = '换个关键词试试';
      return;
    }

    emptyEl.classList.remove('show');

    const frag = document.createDocumentFragment();
    filtered.forEach(function (item) {
      frag.appendChild(renderCard(item));
    });

    notesEl.innerHTML = '';
    notesEl.appendChild(frag);
  }

  async function filterBySearch(list, q) {
    if (state.libraryTab === 'worldview') {
      return list.filter(function (w) {
        const text = ((w.name || '') + ' ' + (w.summary || '') + ' ' + (w.settings || '') + ' ' + ((w.tags || []).join(' '))).toLowerCase();
        return text.indexOf(q) !== -1;
      });
    }
    if (state.libraryTab === 'character') {
      const wvMap = await worldviewNameMap();
      return list.filter(function (ch) {
        const wvName = wvMap[ch.worldviewId] || '未归属';
        const text = ((ch.name || '') + ' ' + (ch.appearance || '') + ' ' + (ch.personality || '') + ' ' +
                      (ch.background || '') + ' ' + ((ch.tags || []).join(' ')) + ' ' + wvName).toLowerCase();
        return text.indexOf(q) !== -1;
      });
    }
    if (state.libraryTab === 'map') {
      const wvMap = await worldviewNameMap();
      return list.filter(function (mp) {
        const wvName = wvMap[mp.worldviewId] || '未归属';
        const placeNames = (mp.places || []).map(function (p) { return p.name; }).join(' ');
        const text = ((mp.name || '') + ' ' + wvName + ' ' + placeNames).toLowerCase();
        return text.indexOf(q) !== -1;
      });
    }
    return list;
  }

  function renderCard(item) {
    const card = document.createElement('article');
    card.className = 'note';
    card.dataset.id = item.id;

    const head = document.createElement('div');
    head.className = 'note-head';

    const title = document.createElement('div');
    title.className = 'note-title';
    title.textContent = item.name || '未命名';

    const time = document.createElement('div');
    time.className = 'note-time';
    time.textContent = formatTime(item.updatedAt);

    head.appendChild(title);
    head.appendChild(time);

    if (state.libraryTab === 'map' && item.imageUrl) {
      const thumb = document.createElement('img');
      thumb.className = 'note-thumb';
      thumb.src = item.imageUrl;
      thumb.alt = '';
      thumb.onerror = function () { thumb.style.display = 'none'; };
      head.insertBefore(thumb, title);
    }

    const preview = document.createElement('p');
    preview.className = 'note-preview';
    preview.textContent = cardSubtitle(item);

    card.appendChild(head);
    card.appendChild(preview);
    return card;
  }

  function cardSubtitle(item) {
    if (state.libraryTab === 'worldview') {
      return truncate(item.summary, 60) || '暂无简介';
    }
    if (state.libraryTab === 'character') {
      const wvName = (cardSubtitle._wvMap || {})[item.worldviewId] || '未归属';
      const pers = truncate(item.personality, 40);
      return wvName + (pers ? ' · ' + pers : '');
    }
    if (state.libraryTab === 'map') {
      const wvName = (cardSubtitle._wvMap || {})[item.worldviewId] || '未归属';
      const n = (item.places || []).length;
      return wvName + ' · ' + n + ' 个地点';
    }
    return '';
  }

  /* ---------------- 编辑器 ---------------- */

    const tas = formBody.querySelectorAll('textarea');
    for (let i = 0; i < tas.length; i++) {
      const t = tas[i];
      t.style.height = 'auto';

  function autoGrowNote() {
    const t = document.getElementById('f-body');

    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  }

  function bindAutoGrow() {
    const tas = formBody.querySelectorAll('textarea');
    for (let i = 0; i < tas.length; i++) {

      html += '<option value="' + w.id + '"' + sel + '>' + (w.name || '未命名') + '</option>';

  async function openEditor(mode, type, id) {
    state.editorMode = mode;
    editorEl.dataset.mode = mode;

    if (mode === 'note') {
      state.noteEditing = id || null;
      state.pendingMentions = {};
      backLabel.textContent = '笔记';

      const note = id ? await DB.getNote(id) : null;
      if (note && note.mentions) {
        state.pendingMentions = Object.assign({}, note.mentions);
      }

      formBody.innerHTML =
        '<input id="f-title" class="title" placeholder="标题" autocomplete="off" spellcheck="false" value="' + esc(note ? note.title : '') + '">' +
        '<textarea id="f-body" class="content" placeholder="开始输入…" spellcheck="false">' + esc(note ? note.body : '') + '</textarea>' +
        '<div class="editor-toolbar"><button type="button" id="mentionBtn">@ 提及设定</button></div>';

      formBody.querySelector('#f-body').addEventListener('input', autoGrowNote);
      showEditor(note);
      return;
    }

    state.libraryEditing = { type: type, id: id || null };
    state.pendingMentions = null;
    backLabel.textContent = TAB_LABEL[type];

    if (type === 'worldview') {
      const wv = id ? await DB.getWorldview(id) : null;
      formBody.innerHTML = worldviewForm(wv);
      bindAutoGrow();
      showEditor(wv);
    } else if (type === 'character') {
      const ch = id ? await DB.getCharacter(id) : null;
      const wvs = await DB.listWorldviews();
      formBody.innerHTML = characterForm(ch, wvs);
      bindAutoGrow();
      showEditor(ch);
    } else if (type === 'map') {
      const mp = id ? await DB.getMap(id) : null;
      const wvs = await DB.listWorldviews();
      formBody.innerHTML = mapForm(mp, wvs);
      bindAutoGrow();
      bindMapEvents();
      showEditor(mp);
    }
  }

  function showEditor(rec) {
    editorEl.classList.add('open');
    editorEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (rec) updateMeta(rec);
    requestAnimationFrame(function () {
      autoGrowAll();
      if (state.editorMode === 'note') autoGrowNote();
      const first = formBody.querySelector('input, textarea, select');
      if (first && !rec) setTimeout(function () { first.focus(); }, 320);
    });
  }

        '<label class="field-label">图片链接</label>' +
        '<input id="f-imageurl" value="' + esc(mp.imageUrl || '') + '" placeholder="粘贴图片 URL，留空则显示占位" />' +
        '<img id="f-imgpreview" class="img-preview" style="display:none;" alt="" />' +
      '</div>' +
      '<div class="field">' +
        '<label class="field-label">地点</label>' +
        '<div id="placeList">' + placesHtml + '</div>' +
        '<button class="add-place" id="addPlace" type="button">+ 添加地点</button>' +
      '</div>';
  }

  function placeRowHtml(p) {
    return '' +
      '<div class="place">' +
        '<input class="p-name" value="' + esc(p.name) + '" placeholder="地点名" />' +
        '<input class="p-desc" value="' + esc(p.desc) + '" placeholder="描述" />' +
        '<button class="p-del" type="button" aria-label="删除">×</button>' +
      '</div>';
  }

  function bindMapEvents() {
    const imgInput = formBody.querySelector('#f-imageurl');
    const imgPreview = formBody.querySelector('#f-imgpreview');
    function refreshPreview() {
      const url = imgInput.value.trim();
      if (url) {
        imgPreview.src = url;
        imgPreview.style.display = 'block';
      } else {
        imgPreview.style.display = 'none';
        imgPreview.src = '';
      }
    }
    imgInput.addEventListener('input', refreshPreview);
    refreshPreview();

    const placeList = formBody.querySelector('#placeList');
    placeList.addEventListener('click', function (e) {
      const del = e.target.closest('.p-del');
      if (del) {
        const row = del.closest('.place');
        if (row) row.remove();
      }
    });
    formBody.querySelector('#addPlace').addEventListener('click', function () {
      placeList.insertAdjacentHTML('beforeend', placeRowHtml({ name: '', desc: '' }));
    });
  }

  function readTags() {
    const el = formBody.querySelector('#f-tags');
    if (!el) return [];
    return el.value.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  async function closeEditor() {
    await flushSave();
    editorEl.classList.remove('open');
    editorEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.libraryEditing = null;
    state.noteEditing = null;
    state.editorMode = null;
    state.pendingMentions = null;
    render();
  }

  async function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    await saveNow();
  }

  async function parseMentions(body, pending) {
    const result = {};
    const re = /@([^\s@，。！？、,.!?]{1,20})/g;
    let m;
    while ((m = re.exec(body)) !== null) {
      const name = m[1];
      if (result[name]) continue;
      if (pending && pending[name]) {
        result[name] = pending[name];
        continue;
      }
      const ent = await findEntityByName(name);
      if (ent) result[name] = ent;
    }
    return result;
  }

  async function findEntityByName(name) {
    const wvs = await DB.listWorldviews();
    const w = wvs.find(function (x) { return (x.name || '') === name; });
    if (w) return { type: 'worldview', id: w.id };
    const chs = await DB.listCharacters();
    const c = chs.find(function (x) { return (x.name || '') === name; });
    if (c) return { type: 'character', id: c.id };
    const mps = await DB.listMaps();
    const mp = mps.find(function (x) { return (x.name || '') === name; });
    if (mp) return { type: 'map', id: mp.id };
    return null;
  }

  async function saveNow() {
    if (!state.editorMode) return;

    if (state.editorMode === 'note') {
      const titleEl = document.getElementById('f-title');
      const bodyEl = document.getElementById('f-body');
      const title = titleEl ? titleEl.value : '';
      const body = bodyEl ? bodyEl.value : '';
      const id = state.noteEditing;

      if (!title.trim() && !body.trim()) {
        if (id) await DB.deleteNote(id);
        state.noteEditing = null;
        state.editorMode = null;
        render();
        return;
      }

      const newMentions = await parseMentions(body, state.pendingMentions);
      const rec = await DB.saveNote({ id: id, title: title.trim(), body: body, mentions: newMentions });
      if (!id) state.noteEditing = rec.id;
      state.pendingMentions = newMentions;
      updateMeta(rec);
      return;
    }

    const { type, id } = state.libraryEditing;

    if (type === 'worldview') {
      const name = val('#f-name');
      const summary = val('#f-summary');
      const settings = val('#f-settings');
      const tags = readTags();
      if (!name) {
        if (id) await DB.deleteWorldview(id);
        state.libraryEditing = null;
        state.editorMode = null;
        render();
        return;
      }
      const rec = await DB.saveWorldview({ id: id, name: name, summary: summary, settings: settings, tags: tags });
      if (!id) state.libraryEditing.id = rec.id;
      updateMeta(rec);
    } else if (type === 'character') {
      const name = val('#f-name');
      if (!name) {
        if (id) await DB.deleteCharacter(id);
        state.libraryEditing = null;
        state.editorMode = null;
        render();
        return;
      }
      const obj = {
        id: id,
        name: name,
        worldviewId: val('#f-worldview') || '',
        age: val('#f-age'),
        gender: val('#f-gender'),
        appearance: val('#f-appearance'),
        personality: val('#f-personality'),
        background: val('#f-background'),
        tags: readTags()
      };
      const rec = await DB.saveCharacter(obj);
      if (!id) state.libraryEditing.id = rec.id;
      updateMeta(rec);
    } else if (type === 'map') {
      const name = val('#f-name');
      if (!name) {
        if (id) await DB.deleteMap(id);
        state.libraryEditing = null;
        state.editorMode = null;
        render();
        return;
      }
      const places = [];
      const rows = formBody.querySelectorAll('#placeList .place');
      for (let i = 0; i < rows.length; i++) {
        const nm = rows[i].querySelector('.p-name').value.trim();
        const ds = rows[i].querySelector('.p-desc').value.trim();
        if (nm || ds) places.push({ id: uid(), name: nm, desc: ds });
      }
      const obj = {
        id: id,
        name: name,
        worldviewId: val('#f-worldview') || '',
        imageUrl: val('#f-imageurl').trim(),
        places: places
      };
      const rec = await DB.saveMap(obj);
      if (!id) state.libraryEditing.id = rec.id;
      updateMeta(rec);
    }
  }

  function val(sel) {
    const el = formBody.querySelector(sel);
    return el ? el.value : '';
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }

  /* ---------------- @ 提及选择器 ---------------- */
  function openMentionSheet() {
    mentionSheet.hidden = false;
    mentionSearch.value = '';
    renderMentionList('');
  }

  function closeMentionSheet() {
    mentionSheet.hidden = true;
  }

  async function renderMentionList(q) {
    const wvs = await DB.listWorldviews();
    const chs = await DB.listCharacters();
    const mps = await DB.listMaps();

    const groups = [
      { label: '世界观', type: 'worldview', items: wvs },
      { label: '角色', type: 'character', items: chs },
      { label: '地图', type: 'map', items: mps }
    ];

    let html = '';
    let any = false;
    groups.forEach(function (g) {
      const filtered = q ? g.items.filter(function (it) {
        return (it.name || '').toLowerCase().indexOf(q) !== -1;
      }) : g.items;
      if (!filtered.length) return;
      any = true;
      html += '<div class="sheet-group">' + g.label + '</div>';
      filtered.forEach(function (it) {
        html += '<div class="sheet-item" data-type="' + g.type + '" data-id="' + it.id + '" data-name="' + esc(it.name) + '">' + esc(it.name || '未命名') + '</div>';
      });
    });

    if (!any) {
      html = '<div style="text-align:center;padding:40px 0;color:var(--label-3);">还没有设定内容</div>';
    }
    mentionList.innerHTML = html;
  }

  /* ---------------- 事件绑定 ---------------- */

  // 底部导航
  tabbar.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-system]');
    if (btn) switchSystem(btn.dataset.system);
  });

  // 笔记列表点击（chip 优先跳转，否则打开笔记）
  notesListEl.addEventListener('click', function (e) {
    const chip = e.target.closest('.mention');
    if (chip) {
      jumpToLibrary(chip.dataset.type, chip.dataset.id);
      return;
    }
    const card = e.target.closest('.note');
    if (card) openEditor('note', null, card.dataset.id);
  });

  // 设定列表点击
  notesEl.addEventListener('click', function (e) {
    const card = e.target.closest('.note');
    if (card) openEditor('library', state.libraryTab, card.dataset.id);
  });

  // 新建
  fab.addEventListener('click', async function () {
    if (state.system === 'notes') {
      const rec = await DB.saveNote({ title: '', body: '', mentions: {} });
      openEditor('note', null, rec.id);
    } else {
      openEditor('library', state.libraryTab, null);
    }
  });

  // 表单输入保存（事件委托，两种模式通用）
  formBody.addEventListener('input', function () {
    scheduleSave();
  });

  // 笔记编辑器内的 @ 按钮（事件委托）
  formBody.addEventListener('click', function (e) {
    if (e.target.closest('#mentionBtn')) openMentionSheet();
  });

  // 关闭编辑器（会先保存）
  backBtn.addEventListener('click', closeEditor);
  doneBtn.addEventListener('click', closeEditor);

  // 删除
  deleteBtn.addEventListener('click', async function () {
    if (state.editorMode === 'note') {
      const id = state.noteEditing;
      if (!id) { closeEditor(); return; }
      if (!window.confirm('删除这条笔记？此操作无法撤销。')) return;
      await DB.deleteNote(id);
      state.noteEditing = null;
      closeEditor();
    } else if (state.editorMode === 'library') {
      if (!state.libraryEditing) return;
      const { type, id } = state.libraryEditing;
      if (!id) { closeEditor(); return; }
      if (!window.confirm('删除这条' + TAB_LABEL[type] + '？此操作无法撤销。')) return;
      if (type === 'worldview') await DB.deleteWorldview(id);
      else if (type === 'character') await DB.deleteCharacter(id);
      else if (type === 'map') await DB.deleteMap(id);
      state.libraryEditing = null;
      closeEditor();
    }
  });

  // 搜索
  notesSearch.addEventListener('input', renderNotes);
  librarySearch.addEventListener('input', renderLibrary);

  // 设定子 tab 切换
  tabsEl.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    const tab = btn.dataset.tab;
    if (tab === state.libraryTab) return;
    state.libraryTab = tab;
    tabsEl.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    pageTitle.textContent = TAB_LABEL[tab];
    librarySearch.value = '';
    renderLibrary();
  });

  // @ 选择器：搜索
  mentionSearch.addEventListener('input', function () {
    renderMentionList(mentionSearch.value.trim().toLowerCase());
  });

  // @ 选择器：选中一项
  mentionList.addEventListener('click', function (e) {
    const item = e.target.closest('.sheet-item');
    if (!item) return;
    const type = item.dataset.type;
    const id = item.dataset.id;
    const name = item.dataset.name;

    const bodyEl = document.getElementById('f-body');
    if (!bodyEl) return;

    const start = bodyEl.selectionStart;
    const end = bodyEl.selectionEnd;
    const val = bodyEl.value;
    const insert = '@' + name + ' ';
    bodyEl.value = val.slice(0, start) + insert + val.slice(end);

    if (state.pendingMentions) {
      state.pendingMentions[name] = { type: type, id: id };
    }

    closeMentionSheet();
    bodyEl.focus();
    const pos = start + insert.length;
    bodyEl.setSelectionRange(pos, pos);
    scheduleSave();
  });

  // @ 选择器：关闭
  mentionClose.addEventListener('click', closeMentionSheet);
  mentionSheet.addEventListener('click', function (e) {
    if (e.target === mentionSheet) closeMentionSheet();
  });

  // 快捷键：Esc 退出编辑
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!mentionSheet.hidden) { closeMentionSheet(); return; }
      if (editorEl.classList.contains('open')) closeEditor();
    }
  });

  // 页面隐藏/关闭前保存
  window.addEventListener('pagehide', function () { if (state.editorMode) flushSave(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && state.editorMode) flushSave();
  });

  /* ---------------- 启动 ---------------- */
  (async function () {
    await DB.init();

    // 实时同步：任意表变更都重新渲染
    sb.channel('oc-realtime')
      .on('postgres_changes', { event: '*', schema: 'public' }, function () {
        render();
      })
      .subscribe();

    switchSystem('notes');
  })();
})();
</script>
</body>
</html>
