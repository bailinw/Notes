<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0d0e12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="笔记" />
<title>笔记</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #000;
    --card: #1c1c1e;
    --card-press: #2c2c2e;
    --card-hover: #232326;
    --label: #fff;
    --label-2: rgba(235, 235, 245, .6);
    --label-3: rgba(235, 235, 245, .32);
    --sep: rgba(84, 84, 88, .5);
    --blue: #0a84ff;
    --red: #ff453a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { overflow-x: hidden; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  button {
    font-family: inherit;
    border: 0;
    background: none;
    color: inherit;
    padding: 0;
    cursor: pointer;
  }

  input, textarea, select {
    font-family: inherit;
    border: 0;
    background: none;
    color: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  input::placeholder, textarea::placeholder { color: var(--label-3); }

  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }

  /* ============ 双体系页面 ============ */
  .system-page { display: none; }
  .system-page.active { display: block; }

  /* ============ 底部导航 ============ */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex;
    height: calc(49px + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(28, 28, 30, .86);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--sep);
  }
  .tabbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
    color: var(--label-3);
    transition: color .15s;
  }
  .tabbar button.active { color: var(--blue); }
  .tabbar svg {
    width: 23px; height: 23px;
    fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============ 列表页 ============ */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px calc(120px + 49px + var(--safe-bottom));
    min-height: 100%;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: calc(22px + var(--safe-top)) 4px 16px;
  }

  .page-head h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -.8px;
    line-height: 1.15;
  }

  .count {
    font-size: 13px;
    color: var(--label-3);
    flex: none;
  }

  /* 分段控件 */
  .segmented {
    display: flex;
    background: var(--card);
    border-radius: 9px;
    padding: 2px;
    margin: 0 4px 16px;
  }
  .segmented button {
    flex: 1;
    height: 32px;
    border-radius: 7px;
    font-size: 14px;
    color: var(--label-2);
  }
  .segmented button.active {
    background: #3a3a3c;
    color: var(--label);
    font-weight: 600;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 11px;
    background: var(--card);
    border-radius: 11px;
    margin-bottom: 18px;
    transition: background .15s ease;
  }

  .search:focus-within { background: var(--card-press); }

  .search svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: var(--label-3);
    transition: fill .15s ease;
  }

  .search:focus-within svg { fill: var(--label-2); }

  .search input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
  }

  .notes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .note {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .note:active { background: var(--card-press); transform: scale(.985); }

  @media (hover: hover) {
    .note:hover { background: var(--card-hover); }
  }

  .note-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  .note-title {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-title.untitled { color: var(--label-2); }

  .note-time {
    flex: none;
    font-size: 12px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
  }

  .note-preview {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--label-2);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-thumb {
    float: right;
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 6px;
    margin-left: 10px;
  }

  .mention { color: var(--blue); }

  /* 空状态 */
  .empty {
    display: none;
    text-align: center;
    padding: 90px 20px;
  }

  .empty.show { display: block; }

  .empty p {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 500;
    color: var(--label-2);
  }

  .empty span { font-size: 14px; color: var(--label-3); }

  /* 悬浮新建按钮 */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + 49px + var(--safe-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0a84ff, #0066d6);
    color: #fff;
    box-shadow: 0 8px 24px rgba(10, 132, 255, .38);
    transition: transform .16s ease, box-shadow .16s ease;
    z-index: 5;
  }

  .fab:active {
    transform: scale(.9);
    box-shadow: 0 4px 12px rgba(10, 132, 255, .3);
  }

  /* ============ 编辑页 ============ */
  .editor {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .34s cubic-bezier(.32, .72, 0, 1);
    will-change: transform;
    display: flex;
    flex-direction: column;
  }

  .editor.open { transform: translateX(0); }

  .editor-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .editor-bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 0 8px;
  }

  .bar-btn {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 17px;
    color: var(--blue);
    padding: 8px 2px;
    transition: opacity .12s ease;
  }

  .bar-btn:active { opacity: .45; }
  .bar-btn.primary { font-weight: 600; }

  .bar-btn svg {
    width: 11px;
    height: 19px;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .editor-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(32px + var(--safe-bottom));
    overscroll-behavior: contain;
  }

  .field { margin-bottom: 18px; }

  .field-label {
    display: block;
    font-size: 13px;
    color: var(--label-3);
    margin-bottom: 6px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--label);
  }

  .field select {
    -webkit-appearance: menulist;
    appearance: menulist;
  }

  .field textarea {
    min-height: 80px;
    resize: none;
    overflow: hidden;
  }

  .row-2 {
    display: flex;
    gap: 10px;
  }
  .row-2 .field { flex: 1; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .chip {
    display: inline-flex;
    padding: 4px 10px;
    background: var(--card-press);
    border-radius: 10px;
    font-size: 13px;
    color: var(--label-2);
  }

  .img-preview {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-top: 8px;
  }

  .place {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 8px;
  }
  .place input {
    background: var(--card);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
  }
  .place .p-name { flex: 0 0 110px; }
  .place .p-desc { flex: 1; }
  .place .p-del {
    flex: none;
    width: 34px;
    color: var(--red);
    font-size: 20px;
    line-height: 1;
  }
  .add-place {
    display: block;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    background: var(--card);
    color: var(--blue);
    font-size: 15px;
    margin-top: 4px;
  }

  .meta {
    font-size: 13px;
    color: var(--label-3);
    padding: 14px 0;
    border-top: 1px solid var(--sep);
    font-variant-numeric: tabular-nums;
  }

  .delete-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border-radius: 14px;
    background: var(--card);
    color: var(--red);
    font-size: 17px;
    text-align: center;
    transition: background .15s ease;
  }

  .delete-btn:active { background: var(--card-press); }

  @media (hover: hover) {
    .delete-btn:hover { background: var(--card-hover); }
  }

  /* ============ 笔记编辑器（复用 field 风格） ============ */
  .title {
    display: block;
    width: 100%;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--label);
    margin-bottom: 12px;
  }
  .content {
    display: block;
    width: 100%;
    min-height: 240px;
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--label);
    resize: none;
    overflow: hidden;
  }

  .editor-toolbar { margin-top: 8px; }
  #mentionBtn {
    padding: 8px 14px;
    background: var(--card);
    border-radius: 10px;
    color: var(--blue);
    font-size: 14px;
  }

  /* ============ @ 提及选择器 ============ */
  .sheet-mask {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end;
  }
  .sheet-mask[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-height: 70dvh;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(20px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-head span { font-size: 17px; font-weight: 600; }
  .sheet-head button { color: var(--blue); font-size: 16px; }
  .sheet-list { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-group { font-size: 12px; color: var(--label-3); padding: 10px 4px 6px; }
  .sheet-item {
    padding: 12px;
    border-radius: 10px;
    background: var(--bg);
    margin-bottom: 6px;
    font-size: 16px;
  }
  .sheet-item:active { background: var(--card-press); }

  /* 桌面端微调 */
  @media (min-width: 720px) {
    .page { padding-top: 8px; }
    .fab { right: calc(50% - 360px + 4px); }
  }

  #app {
    height: 100%;
    opacity: 0;
    -webkit-filter: blur(8px);
    filter: blur(8px);
    transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                -webkit-filter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                filter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: opacity, filter;
  }
  #app.app-visible {
    opacity: 1;
    -webkit-filter: blur(0);
    filter: blur(0);
  }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 200;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ============ 新版开屏锁屏 ============ */
  .bg-grid {
    position: fixed; inset: 0;
    z-index: -3;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
  }

  .noise {
    position: fixed; inset: 0;
    z-index: -1;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .bg-glow-1 {
    position: fixed;
    top: -10%; left: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(100, 150, 255, 0.04) 0%, transparent 60%);
    filter: blur(40px);
    z-index: -2;
    animation: floatGlow1 10s ease-in-out infinite alternate;
  }
  .bg-glow-2 {
    position: fixed;
    bottom: -10%; right: -10%;
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(255, 200, 100, 0.03) 0%, transparent 60%);
    filter: blur(40px);
    z-index: -2;
    animation: floatGlow2 12s ease-in-out infinite alternate;
  }

  @keyframes floatGlow1 {
    0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
    100% { transform: scale(1.1) translate(20px, 20px); opacity: 1; }
  }
  @keyframes floatGlow2 {
    0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
    100% { transform: scale(1.1) translate(-20px, -20px); opacity: 1; }
  }

  .sys-wrap {
    position: fixed; inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(32px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
    background: var(--bg);
    overflow: hidden;
    opacity: 0;
    -webkit-filter: blur(4px);
    filter: blur(4px);
    transform: scale(0.92);
    will-change: opacity, transform, filter;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                -webkit-filter 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                filter 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .sys-wrap.entered {
    opacity: 1;
    -webkit-filter: blur(0);
    filter: blur(0);
    transform: scale(1);
  }

  .sys-wrap.leaving {
    opacity: 0;
    transform: scale(1.03);
    pointer-events: none;
    transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .sys-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--label-3);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--label);
    text-shadow: 0 0 10px rgba(255,255,255,0.15);
  }

  .brand-icon {
    width: 14px; height: 14px;
    border: 1.5px solid var(--label);
    border-radius: 3px;
    position: relative;
    box-shadow: 0 0 8px rgba(255,255,255,0.1);
  }
  .brand-icon::after {
    content: '';
    position: absolute;
    inset: 3px;
    background: var(--label);
  }

  .sys-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot-status {
    width: 6px; height: 6px;
    background: #30d158;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(48, 209, 88, 0.8);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .sys-main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    transform: translateY(-4vh);
  }
  .sys-main.shake {
    animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes shake {
    0%, 100% { transform: translateY(-4vh) translateX(0); }
    20% { transform: translateY(-4vh) translateX(-10px); }
    40% { transform: translateY(-4vh) translateX(10px); }
    60% { transform: translateY(-4vh) translateX(-6px); }
    80% { transform: translateY(-4vh) translateX(6px); }
  }

  .ambient-glow {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 245, 220, 0.09) 0%, rgba(255, 240, 200, 0.03) 40%, transparent 70%);
    filter: blur(30px);
    pointer-events: none;
    z-index: -1;
    animation: glowBreath 4s ease-in-out infinite alternate;
  }

  @keyframes glowBreath {
    0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
    100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
  }

  .input-wrap {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 58px;
  }

  .input-wrap input {
    width: 100%;
    background: none;
    border: none;
    padding: 8px 0 24px 0;
    text-align: center;
    color: var(--label);
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-indent: 0.25em;
    outline: none;
    -webkit-appearance: none;
    text-shadow: 0 0 12px rgba(255,255,255,0);
    transition: text-shadow 0.3s ease;
  }

  .input-wrap input:focus {
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
  }

  .input-wrap input::placeholder {
    color: var(--label-3);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-shadow: none;
  }

  .underline {
    position: absolute;
    bottom: 0;
    width: 110px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.4s ease,
                box-shadow 0.4s ease;
  }

  .input-wrap input:focus + .underline {
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
  }

  .enter-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .enter-btn {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    color: var(--label);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    transition: color 0.3s ease, font-weight 0.1s ease, text-shadow 0.3s ease;
    animation: breath 2.5s ease-in-out infinite;
  }

  @keyframes breath {
    0%, 100% { opacity: 0.4; text-shadow: 0 0 5px rgba(255,255,255,0.1); }
    50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
  }

  .enter-btn-wrap.loading .enter-btn,
  .enter-btn-wrap.error .enter-btn,
  .enter-btn-wrap.success .enter-btn {
    animation: none;
    opacity: 1;
  }

  .enter-btn-wrap.error .enter-btn {
    color: var(--red);
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 69, 58, 0.5);
  }

  .enter-btn-wrap.success .enter-btn {
    color: #30d158;
    text-shadow: 0 0 12px rgba(48, 209, 88, 0.6);
  }

  .indicator-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 4px;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }

  .indicator-wrap.hide-blur {
    opacity: 0;
    filter: blur(8px);
  }

  .btn-dot {
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
  }

  .btn-progress {
    width: 0px;
    height: 2px;
    background: #fff;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
    opacity: 0;
    transition: width 0.1s linear, opacity 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
  }

  .enter-btn-wrap.loading .btn-dot,
  .enter-btn-wrap.error .btn-dot,
  .enter-btn-wrap.success .btn-dot { display: none; }

  .enter-btn-wrap.loading .btn-progress,
  .enter-btn-wrap.error .btn-progress,
  .enter-btn-wrap.success .btn-progress { opacity: 1; }

  .enter-btn-wrap.error .btn-progress {
    background: var(--red);
    box-shadow: 0 0 10px rgba(255, 69, 58, 0.8);
  }

  .enter-btn-wrap.success .btn-progress {
    background: #30d158;
    box-shadow: 0 0 10px rgba(48, 209, 88, 0.8);
  }

  .sys-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--label-3);
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .sys-wrap { padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom)); }
    .sys-main { transform: translateY(-2vh); }
    @keyframes shake {
      0%, 100% { transform: translateY(-2vh) translateX(0); }
      20% { transform: translateY(-2vh) translateX(-10px); }
      40% { transform: translateY(-2vh) translateX(10px); }
      60% { transform: translateY(-2vh) translateX(-6px); }
      80% { transform: translateY(-2vh) translateX(6px); }
    }
  }
</style>
</head>
<body>

<!-- ===================== 全新开屏系统网关 ===================== -->
<div class="sys-wrap" id="lockScreen">

  <div class="bg-grid"></div>
  <div class="noise"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <header class="sys-header">
    <div class="brand">
      <div class="brand-icon"></div>
      <span>WORKSPACE</span>
    </div>
    <div class="sys-status">
      <span class="dot-status"></span>
      <span>SYS.ONLINE</span>
    </div>
  </header>

  <main class="sys-main" id="sysMain">
    <div class="ambient-glow"></div>

    <div class="input-wrap">
      <input type="password" id="pwdInput" placeholder="请输入访问密码" maxlength="20" autocomplete="off" spellcheck="false">
      <div class="underline"></div>
    </div>

    <div class="enter-btn-wrap" id="btnWrap">
      <button class="enter-btn" id="unlockBtn">进入系统</button>

      <div class="indicator-wrap" id="indicatorWrap">
        <div class="btn-dot"></div>
        <div class="btn-progress" id="btnProgress"></div>
      </div>
    </div>
  </main>

  <footer class="sys-footer">
    <span>RAMSHACKLE TROUPE</span>
    <span>BETA</span>
  </footer>

</div>

<div id="app">

  <!-- ===================== 笔记体系 ===================== -->
  <div class="page system-page active" id="systemNotes">
    <header class="page-head">
      <h1>笔记</h1>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 3.5a6.5 6.5 0 1 0 4.06 11.58l3.68 3.68a1 1 0 0 0 1.42-1.42l-3.68-3.68A6.5 6.5 0 0 0 10 3.5Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
      </svg>
      <input id="notesSearch" type="search" placeholder="搜索" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="notes" id="notesList"></div>

    <div class="empty" id="notesEmpty">
      <p>还没有笔记</p>
      <span>点击右下角的 + 开始记录</span>
    </div>
  </div>

  <!-- ===================== 设定体系 ===================== -->
  <div class="page system-page" id="systemLibrary">
    <div class="segmented" id="tabs">
      <button data-tab="worldview" class="active">世界观</button>
      <button data-tab="character">角色</button>
      <button data-tab="map">地图</button>
    </div>

    <header class="page-head">
      <h1 id="pageTitle">设定</h1>
      <span class="count" id="count"></span>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 3.5a6.5 6.5 0 1 0 4.06 11.58l3.68 3.68a1 1 0 0 0 1.42-1.42l-3.68-3.68A6.5 6.5 0 0 0 10 3.5Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
      </svg>
      <input id="librarySearch" type="search" placeholder="搜索" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>

    <div class="notes" id="notes"></div>

    <div class="empty" id="empty">
      <p>还没有内容</p>
      <span>点击右下角的 + 开始创建</span>
    </div>
  </div>

  <button class="fab" id="fab" aria-label="新建">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button data-system="notes" class="active">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      <span>笔记</span>
    </button>
    <button data-system="library">
      <svg viewBox="0 0 24 24"><path d="M4 6h7v14H4zM13 6h7v14h-7z"/></svg>
      <span>设定</span>
    </button>
  </nav>

  <!-- ===================== 编辑页 ===================== -->
  <section class="editor" id="editor" aria-hidden="true">
    <div class="editor-inner">
      <header class="editor-bar">
        <button class="bar-btn" id="backBtn">
          <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
          <span id="backLabel">返回</span>
        </button>
        <button class="bar-btn primary" id="doneBtn">完成</button>
      </header>

      <div class="editor-body" id="editorBody">
        <div id="formBody"></div>
        <div class="meta" id="meta"></div>
        <button class="delete-btn" id="deleteBtn">删除</button>
      </div>
    </div>
  </section>

</div>

<!-- ===================== @ 提及选择器 ===================== -->
<div class="sheet-mask" id="mentionSheet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <span>插入设定引用</span>
      <button id="mentionClose">取消</button>
    </div>
    <div class="search" style="margin:0 0 12px;">
      <input id="mentionSearch" type="search" placeholder="搜索名称" autocomplete="off" style="font-size:16px;">
    </div>
    <div class="sheet-list" id="mentionList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="js/notes.js"></script>
<script src="js/library.js"></script>

</body>
</html>
